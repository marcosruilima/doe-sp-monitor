name: Baixar DOE-SP

on:
  schedule:
    - cron: "0 10 * * 1-5"
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doe-sp
  cancel-in-progress: false

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install pymupdf playwright
          playwright install --with-deps chromium

      - name: Baixar DOE-SP
        run: python baixar_doe_github.py

      - name: Guardar PDFs e capturas de erro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doe-pdfs
          path: pdf_tmp/
          retention-days: 30
          if-no-files-found: ignore

      - name: Salvar textos no repositório
        if: success()
        run: |
          git config user.name "doe-bot"
          git config user.email "doe-bot@users.noreply.github.com"
          git add doe_sp
          git diff --cached --quiet || (git commit -m "DOE-SP $(date -u +%F)" && git push)
