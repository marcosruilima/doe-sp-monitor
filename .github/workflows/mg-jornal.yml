name: Coletar MG - Diario do Executivo
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: mg-jornal
jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y poppler-utils >/dev/null
      - run: python mg/jornal.py
      - if: always()
        run: |
          git config user.name "mg-bot"
          git config user.email "mg-bot@users.noreply.github.com"
          git add mg/jornal mg/certs
          git commit -m "Diario do Executivo MG" || exit 0
          git pull --rebase
          git push
