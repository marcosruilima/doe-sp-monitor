name: Coletar RJ
on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * 1-5"
    - cron: "30 10 * * 1-5"
permissions:
  contents: write
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python rj/coleta_alerj.py
      - run: |
          git config user.name rj-bot; git config user.email rj-bot@users.noreply.github.com
          git add rj/alerj rj/jornais; git commit -m "Coleta RJ" || true; git pull --rebase -q; git push
