name: Teste RJ
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python rj/teste_acesso.py
      - run: |
          git config user.name rj-bot; git config user.email rj-bot@users.noreply.github.com
          git add rj/teste; git commit -m "Teste de acesso RJ" || true; git push
