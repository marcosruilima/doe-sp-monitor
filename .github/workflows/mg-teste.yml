name: Teste acesso MG
on: workflow_dispatch
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python mg/teste_jornal.py
      - run: |
          git config user.name "mg-bot"
          git config user.email "mg-bot@users.noreply.github.com"
          git add mg/teste
          git commit -m "Teste de acesso MG" || exit 0
          git pull --rebase
          git push
