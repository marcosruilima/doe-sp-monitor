name: Coletar MG

on:
  schedule:
    - cron: "30 9 * * 1-5"    # 6h30 Brasília
    - cron: "30 10 * * 1-5"   # 7h30 Brasília (reserva)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mg
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y poppler-utils >/dev/null
      - name: Coletar ALMG
        continue-on-error: true
        run: python mg/coleta_almg.py
      - name: Coletar Diario do Executivo (Jornal MG)
        continue-on-error: true
        run: python mg/jornal.py
      - name: Salvar no repositório
        if: always()
        run: |
          git config user.name "mg-bot"
          git config user.email "mg-bot@users.noreply.github.com"
          git add mg/almg mg/jornal mg/certs
          git diff --cached --quiet || (git commit -m "MG $(date -u +%F)" && git pull --rebase -q && git push)
